<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Cyber Hex -->
  <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" stroke="url(#cyberNeon)" stroke-width="3" fill="#0A0A16" />
  <!-- Internal Neon Grid lines -->
  <line x1="50" y1="5" x2="50" y2="95" stroke="#B026FF" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
  <!-- Candlesticks in FSL Emblem -->
  <!-- Left candle (Green Bullish) -->
  <line x1="33" y1="34" x2="33" y2="66" stroke="#00FF88" stroke-width="1.5" />
  <rect x="29" y="42" width="8" height="16" fill="#00FF88" rx="1.5" />
  <!-- Center Peak Candle (Neon Falcon wing / Cyan) -->
  <line x1="50" y1="20" x2="50" y2="78" stroke="#00F0FF" stroke-width="2" />
  <rect x="45" y="30" width="10" height="30" fill="url(#cyberNeon)" rx="2" filter="url(#neonGlow)" />
  <!-- Right candle (Magenta) -->
  <line x1="67" y1="28" x2="67" y2="62" stroke="#FF007A" stroke-width="1.5" />
  <rect x="63" y="36" width="8" height="18" fill="#FF007A" rx="1.5" />
  <!-- Tech Chevron Accent -->
  <polyline points="22,76 50,88 78,76" stroke="url(#cyberNeon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
