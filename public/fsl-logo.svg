<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="cyberBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 5)">
    <!-- Hexagon Frame -->
    <polygon points="35,3 65,19 65,51 35,67 5,51 5,19" stroke="url(#cyberBrandGrad)" stroke-width="2.5" fill="#0c0a1a" />
    <polygon points="35,8 60,22 60,48 35,62 10,48 10,22" stroke="#B026FF" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4" fill="none" />
    <!-- Bullish candle left -->
    <line x1="23" y1="24" x2="23" y2="46" stroke="#00FF88" stroke-width="1.2" />
    <rect x="20" y="30" width="6" height="11" fill="#00FF88" rx="1" />
    <!-- Center Hero Candle (FSL Core) -->
    <line x1="35" y1="14" x2="35" y2="56" stroke="#00F0FF" stroke-width="1.8" />
    <rect x="31.5" y="21" width="7" height="25" fill="url(#cyberBrandGrad)" rx="1.5" filter="url(#brandGlow)" />
    <!-- Bearish candle right -->
    <line x1="47" y1="20" x2="47" y2="44" stroke="#FF007A" stroke-width="1.2" />
    <rect x="44" y="26" width="6" height="13" fill="#FF007A" rx="1" />
    <!-- Bottom Chevron -->
    <polyline points="15,55 35,64 55,55" stroke="url(#cyberBrandGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <!-- "FSL" Primary Monogram -->
  <text x="88" y="44" font-family="'Rajdhani', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="url(#cyberBrandGrad)" filter="url(#brandGlow)">FSL</text>
  <!-- "TRADER" Accent -->
  <text x="156" y="44" font-family="'Rajdhani', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#F8FAFC">TRADER</text>

  <!-- Tagline Banner -->
  <g transform="translate(88, 52)">
    <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="4.5" fill="#A855F7">TRADE</text>
    <circle cx="56" cy="9" r="1.5" fill="#00F0FF" />
    <text x="66" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="4.5" fill="#00F0FF">ANALYZE</text>
    <circle cx="148" cy="9" r="1.5" fill="#FF007A" />
    <text x="158" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="4.5" fill="#FF007A">GROW</text>
  </g>

  <!-- AI MARKET VISION PRO Sub-badge -->
  <g transform="translate(258, 16)">
    <rect x="0" y="0" width="86" height="16" rx="3" fill="#1e1035" stroke="#B026FF" stroke-width="1" />
    <text x="43" y="11" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" letter-spacing="1" fill="#00F0FF">AI VISION PRO</text>
  </g>
</svg>
